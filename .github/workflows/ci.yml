# Find full documentation here https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: CI

on:
  pull_request:

  workflow_dispatch:

  push:
    branches:
      - "main"
jobs:
  CI:
    # We want an arm image
    runs-on: ubuntu-24.04-arm

    # See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      contents: read

      # These permissions are required by guardian/actions-riff-raff...
      id-token: write # ...to exchange an OIDC JWT ID token for AWS credentials
      pull-requests: write #...to comment on PRs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Setup Node, checking common Node config files to determine the version of Node to use.
      # Configuring caching is also recommended.
      # See https://github.com/guardian/actions-setup-node
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
          cache-dependency-path: 'cdk/package-lock.json'

      # See https://github.com/guardian/setup-java
      - name: Setup Java and sbt
        uses: guardian/setup-scala@v1

      - run: |
          LAST_TEAMCITY_BUILD=1007
          echo "BUILD_NUMBER=$(( $GITHUB_RUN_NUMBER + $LAST_TEAMCITY_BUILD ))" >> $GITHUB_ENV

      # See https://github.com/github/scripts-to-rule-them-all
      - name: Run script/ci
        run: ./script/ci

      - name: Publish Image
        uses: guardian/actions-publish-image@v0.0.13
        id: publish-image
        with:
          roleArn: ${{ secrets.GU_ARTIFACTS_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Must come after image is published to pick up env var
      - name: Run cdk/script/ci
        working-directory: cdk
        env:
          IMAGE_DIGEST: ${{ steps.publish-image.outputs.imageDigest }}
        run: ./script/ci

      - name: Upload to riff-raff
        uses: guardian/actions-riff-raff@v4.3.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          buildNumber: ${{ env.BUILD_NUMBER }}
          projectName: tools::amiable
          configPath: cdk/cdk.out/riff-raff.yaml
          contentDirectories: |
            cdk.out:
              - cdk/cdk.out
            amiable:
              - dist
