# Devenv project configuration
# Edit this file to configure your project's devcontainer
# and then run `devenv generate` to create the devcontainer.json files

name: "amiable"

modules:
  - mise
  - scala
  - node
  - github-copilot

forwardPorts:
  -  9101

mounts:
  - "source=${localEnv:HOME}/.gu/amiable,target=/home/vscode/.gu/amiable,readonly,type=bind,consistency=cached"
